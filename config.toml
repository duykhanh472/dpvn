[server]
bind = "127.0.0.1:8080"
public_url = "http://localhost:8080"

[database]
url = "mysql://dp:secret@127.0.0.1:3306/dp"
max_connections = 16
min_connections = 2

[paths]
data = "./data"
templates = "./crates/dp-web/src/templates"

[mail]
smtp_url = "smtp://localhost:25"
from = "no-reply@proof.example.org"

[limits]
max_upload_mb = 512
daily_pages = 100
claim_timeout_hours = 72
