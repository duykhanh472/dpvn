name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: dp
          MYSQL_USER: dp
          MYSQL_PASSWORD: secretpassword
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run test suite
        run: cargo test --workspace

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Run migration on empty MySQL database
        env:
          DP_DATABASE_URL: mysql://dp:secretpassword@127.0.0.1:3306/dp
        run: |
          cargo run -p dp-web -- migrate

      - name: Verify application
        env:
          DP_DATABASE_URL: mysql://dp:secretpassword@127.0.0.1:3306/dp
        run: |
          cargo run -p dp-web -- verify

      - name: Hardening static checks
        run: ./scripts/check-hardening.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck deploy scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck deploy/*.sh scripts/*.sh

  nginx-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production nginx config
        run: |
          mkdir -p /tmp/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/certs/privkey.pem \
            -out /tmp/certs/fullchain.pem \
            -subj "/CN=localhost"
          docker run --rm \
            -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/deploy/security-headers.inc:/etc/nginx/security-headers.inc:ro" \
            -v /tmp/certs:/etc/nginx/certs:ro \
            nginx:1.27-alpine nginx -t

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build distroless production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: dproofreaders:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max


  restore-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore drill in a clean MySQL container
        run: |
          chmod +x deploy/*.sh
          ./deploy/restore-drill.sh
