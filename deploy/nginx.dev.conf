# Development / small-deployment nginx server (plain HTTP).
#
# Mount as /etc/nginx/conf.d/default.conf. Put a TLS terminator in front for
# anything reachable from the internet, or use deploy/nginx.conf.

server_tokens off;

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    set $app_upstream "app:8080";

    client_max_body_size 512m;
    client_body_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    include /etc/nginx/security-headers.inc;

    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.inc;
        proxy_pass http://$app_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /readyz {
        access_log off;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.inc;
        proxy_pass http://$app_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location /static/ {
        alias /srv/static/;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/security-headers.inc;
    }

    location /protected/ {
        internal;
        alias /var/lib/dp/;
        add_header Cache-Control "private, max-age=86400" always;
        include /etc/nginx/security-headers.inc;
    }

    location / {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.inc;

        proxy_pass http://$app_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
