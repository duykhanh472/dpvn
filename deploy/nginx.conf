# Production nginx server (TLS + compression + X-Accel-Redirect).
#
# Mount as /etc/nginx/conf.d/default.conf. Certificates live in
# /etc/nginx/certs/fullchain.pem and /etc/nginx/certs/privkey.pem.
#
# Replace `server_name _` with the real hostname, or terminate TLS at an
# upstream load balancer and use deploy/nginx.dev.conf behind it.

server_tokens off;

# Docker's embedded DNS. Resolving the app name per request lets a rolling
# restart move traffic to the new container without reloading nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

# ── HTTP: ACME challenge + permanent redirect ────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    set $app_upstream "app:8080";

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 512m;
    client_body_timeout 60s;
    keepalive_timeout 65s;

    # Compression (text only; images are already compressed).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Baseline headers for locations that do not add their own.
    include /etc/nginx/security-headers.inc;

    # Probes: never cached, never logged.
    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.inc;
        proxy_pass http://$app_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /readyz {
        access_log off;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.inc;
        proxy_pass http://$app_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    # Immutable, content-hashed assets.
    location /static/ {
        alias /srv/static/;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/security-headers.inc;
    }

    # Authorized image delivery via X-Accel-Redirect (§15.2). `internal` means
    # this location cannot be requested directly from the internet.
    location /protected/ {
        internal;
        alias /var/lib/dp/;
        add_header Cache-Control "private, max-age=86400" always;
        include /etc/nginx/security-headers.inc;
    }

    location / {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.inc;

        proxy_pass http://$app_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
}
