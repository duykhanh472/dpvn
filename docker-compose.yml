# Development / small deployment stack.
#
#   docker compose up --build
#   open http://localhost:8080
#
# For TLS and the production image, use docker-compose.prod.yml.

services:
  db:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_vietnamese_ci
    environment:
      MYSQL_DATABASE: dp
      MYSQL_USER: dp
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DP_DATABASE_URL: mysql://dp:${DB_PASSWORD:-secret}@db:3306/dp
      DP_BIND: "0.0.0.0:8080"
      RUST_LOG: "info,dp_web=debug,dp_db=debug"
      DP_LOG_FORMAT: "text"
    volumes:
      - dp-data:/var/lib/dp
      - ./config.toml:/etc/dp/config.toml:ro
    command: ["serve", "-c", "/etc/dp/config.toml"]
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/usr/local/bin/dp", "healthcheck", "--url", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/security-headers.inc:/etc/nginx/security-headers.inc:ro
      - dp-data:/var/lib/dp:ro
      - ./static:/srv/static:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=8m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  db-data:
  dp-data:
