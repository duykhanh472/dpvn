services:
  db:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_vietnamese_ci
    environment:
      MYSQL_DATABASE: dp
      MYSQL_USER: dp
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DP_DATABASE_URL: mysql://dp:${DB_PASSWORD:-secret}@db:3306/dp
      DP_BIND: "0.0.0.0:8080"
    volumes:
      - dp-data:/var/lib/dp
      - ./config.toml:/etc/dp/config.toml:ro
    command: ["serve", "-c", "/etc/dp/config.toml"]
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - dp-data:/var/lib/dp:ro
      - ./static:/srv/static:ro
    restart: unless-stopped

volumes:
  db-data:
  dp-data:
