# Production stack: distroless app image + nginx with TLS and baked assets.
#
# Prerequisites:
#   1. cp .env.example .env and set strong secrets.
#   2. Put fullchain.pem and privkey.pem in ./certs/.
#   3. Set [server].public_url in config.toml to the https URL.
#   4. Create the data volume with the right owner:
#        docker volume create dp-data
#        docker run --rm -v dp-data:/data alpine chown -R 65532:65532 /data
#
# Deploy:
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml run --rm app migrate
#   docker compose -f docker-compose.prod.yml up -d
#
# See docs/operations/deploy.md for the zero-downtime sequence and rollback.

services:
  db:
    image: mysql:8.4
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_vietnamese_ci
      --max-connections=200
      --innodb-buffer-pool-size=1G
    environment:
      MYSQL_DATABASE: dp
      MYSQL_USER: dp
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - db-data:/var/lib/mysql
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DP_DATABASE_URL: mysql://dp:${DB_PASSWORD}@db:3306/dp
      DP_BIND: "0.0.0.0:8080"
      DP_PUBLIC_URL: ${DP_PUBLIC_URL:?DP_PUBLIC_URL is required}
      DP_SMTP_URL: ${DP_SMTP_URL:-smtp://localhost:25}
      RUST_LOG: ${RUST_LOG:-info,dp_web=info,dp_db=warn}
      DP_LOG_FORMAT: "json"
    volumes:
      - dp-data:/var/lib/dp
      - ./config.toml:/etc/dp/config.toml:ro
    command: ["serve", "-c", "/etc/dp/config.toml"]
    restart: unless-stopped
    stop_grace_period: 45s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/usr/local/bin/dp", "healthcheck", "--url", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    build:
      context: .
      dockerfile: deploy/nginx.Dockerfile
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./certbot:/var/www/certbot:ro
      - dp-data:/var/lib/dp:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=8m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  db-data:
  dp-data:
